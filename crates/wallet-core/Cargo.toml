[package]
name = "octo-wallet-core"
description = "SEP-0005 derivation, muxed address encode/decode, and transaction signing. The only crate that handles secret keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Custodial signing helpers (sign_payment / sign_change_trust) survive ONLY as test fixtures
# after the non-custodial cutover. Production binaries must never enable this feature — user
# wallets carry no server-side seed, so these functions have nothing legitimate to sign.
test-fixtures = []

[dependencies]
octo-crypto.workspace = true
stellar-strkey.workspace = true
stellar-base.workspace = true
slip10_ed25519.workspace = true
tiny-bip39.workspace = true
# SECURITY: WalletSeed::generate draws mnemonic entropy from rand::rngs::OsRng explicitly (not
# tiny-bip39's thread_rng default). Re-audit derive.rs if this dependency or rand is bumped.
rand.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
thiserror.workspace = true
serde.workspace = true
hex.workspace = true
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
# Property-based coverage in asset.rs / derive.rs (SEP-0005 derivation, asset-code validation).
proptest.workspace = true
