openapi: 3.1.0
info:
  title: Octo Protocol API
  version: 1.0.0
  description: OpenAPI contract for the /v1 Octo Protocol routes.
servers:
  - url: /
paths:
  /v1/wallets:
    post:
      summary: Create a master wallet (non-custodial)
      description: >
        Registers a wallet from a keypair the CLIENT generated. The server never receives the
        private key or mnemonic — only the public account. `encrypted_backup` is an opaque blob
        the client encrypted under the user's password; the server stores it verbatim for
        new-device recovery and cannot decrypt it.
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - public_key
              properties:
                public_key:
                  type: string
                  description: The client-generated Stellar account (`G...`).
                encrypted_backup:
                  type: string
                  nullable: true
                  description: >
                    Opaque client-encrypted seed backup. Never decryptable by the server.
                label:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
  /v1/wallets/{id}:
    get:
      summary: Get wallet details
      operationId: getWallet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletViewResponse'
  /v1/wallets/{id}/addresses:
    post:
      summary: Generate a dedicated customer address
      operationId: createAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_ref:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressResponse'
    get:
      summary: List addresses
      operationId: listAddresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAddressesResponse'
  /v1/wallets/{id}/withdraw:
    post:
      summary: Withdraw funds
      operationId: withdraw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                amount_stroops:
                  type: integer
                asset:
                  type: object
                  properties:
                    code:
                      type: string
                    issuer:
                      type: string
                  required:
                    - code
                    - issuer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResponse'
  /v1/wallets/{id}/transactions:
    get:
      summary: List transactions
      operationId: listTransactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
  /v1/wallets/{id}/api-key:
    post:
      summary: Generate or rotate the wallet's API key
      description: >
        Dashboard JWT only. The plaintext key is returned once; only its SHA-256 hash is stored.
        The first key needs no body. Once a key exists, `confirm: true` is required to rotate it
        (which immediately invalidates the previous key); without it the call returns 409.
      operationId: generateApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  description: Must be `true` to rotate an existing key.
      responses:
        "201":
          description: Created — the full key, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        "409":
          description: A key already exists and `confirm` was not `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /v1/wallets/{id}/payment-links:
    post:
      summary: Create a payment link
      operationId: createPaymentLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                image_url:
                  type: string
                  nullable: true
                redirect_url:
                  type: string
                  nullable: true
                  description: >
                    Where to send the payer's browser after their payment is confirmed. Octo
                    appends `?status=success&payment_id=<id>&slug=<slug>` when redirecting.
                amount_usdc_stroops:
                  type: integer
                  nullable: true
                  description: Fixed amount in USDC stroops (7dp). Omit/null for a flexible-amount link.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
    get:
      summary: List payment links
      operationId: listPaymentLinks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinksResponse'
  /v1/wallets/{id}/payment-links/{link_id}:
    get:
      summary: Get a payment link
      operationId: getPaymentLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
    put:
      summary: Activate or deactivate a payment link
      operationId: setPaymentLinkActive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
  /v1/wallets/{id}/payment-links/{link_id}/payments:
    get:
      summary: List payments recorded against a payment link
      description: Owner-authenticated only — includes payer name/email.
      operationId: listPaymentLinkPayments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinkPaymentsResponse'
  /v1/pay/{slug}:
    get:
      summary: Get a public payment link
      description: Public, no auth. Used by the hosted checkout page.
      operationId: getPublicPaymentLink
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPaymentLinkResponse'
  /v1/pay/{slug}/intent:
    post:
      summary: Create a payment intent against a public payment link
      description: Public, no auth, rate-limited by IP.
      operationId: createPaymentIntent
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer_name:
                  type: string
                  nullable: true
                payer_email:
                  type: string
                  nullable: true
                amount_usdc_stroops:
                  type: integer
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
  /v1/pay/{slug}/payments/{payment_id}:
    get:
      summary: Poll a payment's status
      description: Public, no auth.
      operationId: getPaymentStatus
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
  /v1/pay/{slug}/signing-info:
    get:
      summary: Get Stellar signing info for the payer's own account
      description: Public, no auth.
      operationId: publicSigningInfo
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: account
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSigningInfoResponse'
  /v1/pay/{slug}/submit-signed:
    post:
      summary: Relay a payer-signed transaction to Horizon
      description: Public, no auth.
      operationId: submitPayment
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_xdr:
                  type: string
                payment_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPaymentResponse'
  /v1/webhooks:
    post:
      summary: Register a webhook
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                secret:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
components:
  schemas:
    Envelope:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
    CreateWalletResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - network
            - address
            - custody
            - funded
          properties:
            id:
              type: string
              format: uuid
            network:
              type: string
            address:
              type: string
            custody:
              type: string
              enum: [client, server]
              description: >
                `client` for non-custodial wallets (the server holds no key for this account).
                `server` is legacy, pre-cutover.
            funded:
              type: boolean
              description: Whether the account was funded on-chain (testnet friendbot).
          # NOTE: `recovery_mnemonic` was previously listed here as REQUIRED. It no longer exists
          # and must not come back: the client generates the mnemonic and the server never sees
          # it. Documenting it would contradict the non-custodial guarantee.
    WalletViewResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - network
            - address
          properties:
            id:
              type: string
              format: uuid
            network:
              type: string
            address:
              type: string
            label:
              type: string
            description:
              type: string
            balance_stroops:
              type: integer
    CreateAddressResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - muxed_address
            - base_address
            - memo_id
          properties:
            id:
              type: string
              format: uuid
            customer_ref:
              type: string
            muxed_address:
              type: string
            base_address:
              type: string
            memo_id:
              type: integer
    ListAddressesResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            required:
              - id
              - muxed_address
              - base_address
              - memo_id
            properties:
              id:
                type: string
                format: uuid
              customer_ref:
                type: string
              muxed_address:
                type: string
              base_address:
                type: string
              memo_id:
                type: integer
    WithdrawResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - status
            - destination
            - amount_stroops
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            stellar_tx_hash:
              type: string
            destination:
              type: string
            amount_stroops:
              type: integer
    ListTransactionsResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
    WebhookResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - url
            - secret
            - active
          properties:
            id:
              type: string
              format: uuid
            url:
              type: string
            secret:
              type: string
            active:
              type: boolean
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        # Errors use the same {statusCode, message, data} envelope as success responses;
        # `data` is null. (The spec previously documented a non-existent `error` field.)
        data:
          nullable: true
    PaymentLinkResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - slug
            - name
            - active
            - collected_usdc_stroops
            - created_at
            - url
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
            description:
              type: string
              nullable: true
            image_url:
              type: string
              nullable: true
            redirect_url:
              type: string
              nullable: true
            amount_usdc_stroops:
              type: integer
              nullable: true
              description: Null means flexible — the payer chooses the amount.
            active:
              type: boolean
            collected_usdc_stroops:
              type: integer
            created_at:
              type: string
              format: date-time
            url:
              type: string
              description: Full hosted checkout URL, e.g. `https://app.octo.dev/pay/ab12cd34ef`.
    ListPaymentLinksResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  - id
                  - slug
                  - name
                  - active
                  - collected_usdc_stroops
                  - created_at
                  - url
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  image_url:
                    type: string
                    nullable: true
                  redirect_url:
                    type: string
                    nullable: true
                  amount_usdc_stroops:
                    type: integer
                    nullable: true
                  active:
                    type: boolean
                  collected_usdc_stroops:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  url:
                    type: string
            next_cursor:
              type: string
              format: uuid
              nullable: true
    ListPaymentLinkPaymentsResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  - id
                  - amount_usdc_stroops
                  - status
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  payer_name:
                    type: string
                    nullable: true
                  payer_email:
                    type: string
                    nullable: true
                  amount_usdc_stroops:
                    type: integer
                  status:
                    type: string
                    enum: [pending, confirmed]
                  transaction_id:
                    type: string
                    format: uuid
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            next_cursor:
              type: string
              format: uuid
              nullable: true
    PublicPaymentLinkResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - name
            - deposit_address
            - asset_code
          properties:
            name:
              type: string
            description:
              type: string
              nullable: true
            image_url:
              type: string
              nullable: true
            redirect_url:
              type: string
              nullable: true
            amount_usdc_stroops:
              type: integer
              nullable: true
            deposit_address:
              type: string
            asset_code:
              type: string
    PaymentIntentResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - payment_id
            - deposit_address
            - amount_usdc_stroops
          properties:
            payment_id:
              type: string
              format: uuid
            deposit_address:
              type: string
            amount_usdc_stroops:
              type: integer
    PaymentStatusResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum: [pending, confirmed]
            transaction_id:
              type: string
              format: uuid
              nullable: true
    PublicSigningInfoResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - account
            - sequence
            - network_passphrase
            - base_fee_stroops
          properties:
            account:
              type: string
            sequence:
              type: string
              description: Serialized as a string — a JS Number would lose precision.
            network_passphrase:
              type: string
            base_fee_stroops:
              type: integer
    SubmitPaymentResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum: [confirmed, failed]
            stellar_tx_hash:
              type: string
              nullable: true
            detail:
              type: string
              nullable: true
              description: Human-readable reason when status is "failed".
